<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 52" fill="none" className="authorized-badge">
  <defs>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="168" height="50" rx="12" fill="url(#badge-bg)" stroke="url(#badge-border)" stroke-width="1.2" />
  
  <!-- Left Shield Badge Icon -->
  <g transform="translate(10, 10)">
    <circle cx="16" cy="16" r="15" fill="#0369a1" fill-opacity="0.25" />
    <!-- Shield Outline -->
    <path d="M16 6 L25 10 V17 C25 22.5 21 26 16 28 C11 26 7 22.5 7 17 V10 L16 6 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Checkmark -->
    <path d="M12 17 L15 20 L20 13" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Badge Text -->
  <g transform="translate(48, 0)">
    <text x="0" y="21" font-family="'JetBrains Mono', 'Space Grotesk', monospace, sans-serif" font-weight="700" font-size="8" letter-spacing="0.16em" fill="#38bdf8">
      OFFICIAL PARTNER
    </text>
    <text x="0" y="36" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.02em" fill="#ffffff">
      STARLINK <tspan fill="url(#gold-accent)">BD</tspan>
    </text>
  </g>
</svg>
