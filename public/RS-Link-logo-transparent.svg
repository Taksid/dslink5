<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Clean High-Precision Satellite Orbit Icon -->
  <g transform="translate(10, 10)">
    <!-- Orbit Arc -->
    <path d="M 12 48 C 6 36, 12 18, 30 10 C 48 2, 64 12, 68 28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 68 28 C 72 44, 58 60, 40 64 C 26 66, 14 58, 10 46" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
    
    <!-- Central Satellite Node -->
    <circle cx="38" cy="34" r="9" fill="#0284c7" />
    <circle cx="38" cy="34" r="5" fill="#ffffff" />
    
    <!-- Solar Panels / Beams -->
    <line x1="22" y1="28" x2="16" y2="26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="54" y1="40" x2="60" y2="42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Pulse Ring -->
    <circle cx="38" cy="34" r="16" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
  </g>

  <!-- Professional Typography -->
  <text x="96" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
    DS<tspan fill="#38bdf8">Link</tspan>
  </text>
  
  <text x="98" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.5" fill="#94a3b8">
    STARLINK PARTNER
  </text>
</svg>
