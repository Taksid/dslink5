<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 74" width="308" height="74" preserveAspectRatio="xMinYMid meet" fill="none">
  <defs>
    <linearGradient id="dsDishGrad" x1="8" y1="16" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="dsOrbitGrad" x1="6" y1="54" x2="62" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Satellite Dish Emblem (Transparent Background) -->
  <g transform="translate(2, 5)">
    <!-- Signal Waves -->
    <path d="M40 16 C47 17, 52 22, 53 29" stroke="#22D3EE" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M41 9 C52 10, 59 17, 60 28" stroke="#0EA5E9" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <!-- Pedestal -->
    <path d="M31 48 L31 56 L38 56 L39 45" fill="#0284C7"/>
    <!-- Dish Bowl -->
    <ellipse cx="29" cy="36" rx="16" ry="11.5" transform="rotate(-38 29 36)" fill="url(#dsDishGrad)" stroke="#7DD3FC" stroke-width="1.4"/>
    <!-- Feed Horn & Arm -->
    <line x1="29" y1="36" x2="43" y2="21" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="43.5" cy="20.5" r="2.6" fill="#FFFFFF"/>
    <!-- Orbital Swoosh Ring -->
    <path d="M12 41 C4 50, 12 58, 31 50 C49 42, 60 30, 51 25" stroke="url(#dsOrbitGrad)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Crisp Vertical Divider -->
  <line x1="72" y1="12" x2="72" y2="62" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Wordmark: DEVSPARK LINK -->
  <text x="83" y="38" font-family="'Plus Jakarta Sans', 'Manrope', 'Inter', system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="0.4">
    <tspan fill="#FFFFFF">DEVSPARK </tspan><tspan fill="#22D3EE">LINK</tspan>
  </text>

  <!-- Subtitle: STARLINK BANGLADESH with flanking lines -->
  <line x1="84" y1="54" x2="102" y2="54" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <text x="190" y="57.5" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Manrope', 'Inter', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.4" fill="#E2E8F0">
    STARLINK BANGLADESH
  </text>
  <line x1="278" y1="54" x2="296" y2="54" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
</svg>
